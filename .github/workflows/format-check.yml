name: Format Check

on:
        pull_request:
                branches: ['main']

jobs:
        format-check:
                runs-on: ubuntu-latest
                steps:
                        - name: Checkout Code
                          uses: actions/checkout@v4
                          with:
                                  fetch-depth: 0
                        - name: Setup Node.js
                          uses: actions/setup-node@v4
                          with:
                                  node-version: 'lts/*'
                                  cache: 'npm'
                        - name: Install Dependencies
                          run: npm ci
                        - name: Check Formatting
                          run: npm run format:check
